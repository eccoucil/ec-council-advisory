services:
  db:
    image: postgres:16-alpine
    container_name: ec-council-advisory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ec_council_advisory
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ec_council_advisory"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
